services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swiss_legal_mcp
      POSTGRES_PASSWORD: swiss_legal_mcp_dev_only
      POSTGRES_DB: swiss_legal_mcp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiss_legal_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10
    # NOTA (Fase 1): ningun proveedor usa todavia esta base de datos (ver
    # docs/architecture.md#persistencia-y-cache); se provisiona aqui porque
    # el stack de desarrollo local descrito en la arquitectura la incluye,
    # no porque apps/mcp-server dependa de ella hoy.

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_BEARER_TOKEN: "change-me-in-a-real-environment"
      LOG_LEVEL: info
    ports:
      - "3000:3000"

volumes:
  postgres_data:
